<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pip</title>
<meta name="description" content="安静的打卡日历。想打的时候，就在日历上留一个点。">

<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#FBFBFA" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#131211" media="(prefers-color-scheme: dark)">

<!-- 零外部资源，所以可以上很严的策略。connect-src 'none' 是一道硬保证：
     即使将来误加了网络代码也会被浏览器拦下。见 TECH 14。 -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; connect-src 'none'; form-action 'none'; base-uri 'none'">

<!-- PWA。路径一律相对：站点在 summersover.github.io/PipPip/ 下，写 / 会指向域名根（TECH 13.2） -->
<link rel="manifest" href="./manifest.webmanifest">
<!-- iOS 不读 manifest 里的 icons，必须单独给一份 180×180 的（TECH 8.1） -->
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<!-- 全屏运行、无地址栏。manifest 的 display 在新 iOS 上够用，但 apple- 前缀那个才是
     iOS 一贯认的，两个都写。 -->
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<link rel="stylesheet" href="./css/app.css">
<!-- 必须在 CSS 之后、且是阻塞式脚本：首次绘制前把 data-theme 定好，否则深色模式会闪白 -->
<script src="./js/theme-boot.js"></script>
</head>
<body>

<main class="app">

  <!-- 数据安全相关的提示常驻在顶部，不可关闭（TECH 11.2）。放在两个视图之上，
       切到设置页也照样看得到。 -->
  <div class="banner" id="banner" role="alert" hidden></div>

  <!-- 首页：月历。设置页是整屏替换它，不是弹窗（PRD 6）。 -->
  <div class="view" id="view-calendar">

    <header class="cal-header">
      <button class="icon-btn" id="prev-month" type="button" aria-label="上个月">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M14.5 5.5 8 12l6.5 6.5"/>
        </svg>
      </button>
      <h1 class="cal-title" id="cal-title"></h1>
      <button class="icon-btn" id="next-month" type="button" aria-label="下个月">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M9.5 5.5 16 12l-6.5 6.5"/>
        </svg>
      </button>
    </header>

    <div class="cal-body">
      <table class="cal-grid" id="cal-grid"></table>
    </div>

    <nav class="toolbar" aria-label="主导航">
      <!-- 三根细长的**实心**柱子，中间那根最高，底边齐平。这一页没有图表，图标只是
           「统计」的通用记号（PRD 9.5）。
           实心而不是描边空心：25px 下描边柱的空心会被抗锯齿糊掉（实测外宽 3.75px 里只剩
           1.93px 空心），看着就是三根粗条；实心细矩形（宽 2.4）在真实尺寸下才真是
           「细长矩形」的样子。 -->
      <button class="toolbar-btn" id="toolbar-stats" type="button">
        <svg viewBox="0 0 24 24" fill="currentColor" stroke="none" aria-hidden="true">
          <rect x="4.6" y="11" width="2.4" height="8" rx="1"/>
          <rect x="10.8" y="5" width="2.4" height="14" rx="1"/>
          <rect x="17" y="14" width="2.4" height="5" rx="1"/>
        </svg>
        <span>统计</span>
      </button>
      <!-- 可见文字是产品名 Pip，但读屏需要知道这一按是干什么的（PRD 12）。
           aria-label 里带上可见文字，不违背「可访问名要包含可见标签」。 -->
    <button class="toolbar-btn toolbar-btn--primary" id="toolbar-pip" type="button" aria-label="Pip，记一笔">
        <span class="toolbar-pill">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true">
            <path d="M12 5.5v13M5.5 12h13"/>
          </svg>
        </span>
        <span>Pip</span>
      </button>
      <!-- 圈 + 6 根径向短线（两根水平），**线全在圈外**，里端留 1.2 的缝。
           线往里伸过圈边就立刻读成齿轮／辐条，所以里端停在圈外（PRD 9.5）。
           原来那个是六边形套圆的「螺母」。
           坐标：r=5.4，缝 1.2 → 线内端距圆心 6.6，线长 2.0 → 外端 8.6。水平两根在
           x = 12±6.6 → 12±8.6；斜四根在 ±60°/±120°（sin60°≈0.866）。
           ★ 第一版这里手算错过一个坐标，左边那根戳进了圆里、右边那根整个丢了——
           六根径向线这种「一圈重复结构」的坐标要用脚本生成粘贴进来，别手算。 -->
      <button class="toolbar-btn" id="toolbar-settings" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true">
          <circle cx="12" cy="12" r="5.4"/>
          <path d="M18.60 12.00L20.60 12.00M15.30 6.28L16.30 4.55M8.70 6.28L7.70 4.55M5.40 12.00L3.40 12.00M8.70 17.72L7.70 19.45M15.30 17.72L16.30 19.45"/>
        </svg>
        <span>设置</span>
      </button>
    </nav>

  </div>

  <!-- 设置页：整屏切换，左上角返回（PRD 7.6）。内容由 js/views/settings.js 填。 -->
  <div class="view" id="view-settings" hidden>
    <header class="settings-header">
      <button class="icon-btn" id="settings-back" type="button" aria-label="返回">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M14.5 5.5 8 12l6.5 6.5"/>
        </svg>
      </button>
      <h1 class="settings-title">设置</h1>
    </header>
    <div class="settings-body" id="settings-body"></div>
  </div>

</main>

<!-- 弹窗。居中的悬浮卡片，只有一个容器，内部是页面栈，不堆叠多层（TECH 7.1） -->
<div class="scrim" id="scrim" hidden></div>
<section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" tabindex="-1" hidden>
  <!-- 顶部那条横条现在只是装饰：卡片居中、高度随内容（有上下限），它不承担任何手势（PRD 9.5） -->
  <div class="sheet-grip">
    <span class="sheet-handle"></span>
  </div>
  <header class="sheet-header">
    <button class="icon-btn sheet-back" id="sheet-back" type="button" aria-label="返回" hidden>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M14.5 5.5 8 12l6.5 6.5"/>
      </svg>
    </button>
    <h2 class="sheet-title" id="sheet-title"></h2>
    <button class="icon-btn" id="sheet-close" type="button" aria-label="关闭">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true">
        <path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/>
      </svg>
    </button>
  </header>
  <div class="sheet-body" id="sheet-body"></div>
  <!-- 固定在卡片底边的动作条。内容长的页面把主操作放这儿，它不跟着内容滚走（PRD 9.5）。
       页面没有底栏动作时是 hidden 的。 -->
  <div class="sheet-footer" id="sheet-footer" hidden></div>
</section>

<script type="module" src="./js/app.js"></script>
</body>
</html>
